name: "Docker Build and Test"

description: "Build and smoke test the NGIAB TEEHR Docker image"

inputs:
  platform:
    description: "Docker platform"
    required: true

  image-tag:
    description: "Local image tag"
    required: true

  buildcloud-endpoint:
    description: "Docker Build Cloud endpoint"
    required: true

runs:
  using: "composite"

  steps:
    - name: Set up Docker Buildx with cloud driver
      uses: docker/setup-buildx-action@v3
      with:
        version: "lab:latest"
        driver: cloud
        endpoint: ${{ inputs.buildcloud-endpoint }}

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ inputs.platform }}
        load: true
        push: false
        tags: ${{ inputs.image-tag }}

    - name: Test Python
      shell: bash
      run: |
        docker run --rm \
          --platform ${{ inputs.platform }} \
          --entrypoint python \
          ${{ inputs.image-tag }} \
          --version

    - name: Test TEEHR import
      shell: bash
      run: |
        docker run --rm \
          --platform ${{ inputs.platform }} \
          --entrypoint python \
          ${{ inputs.image-tag }} \
          -c "import teehr; print('TEEHR import successful')"

    - name: Test Java
      shell: bash
      run: |
        docker run --rm \
          --platform ${{ inputs.platform }} \
          --entrypoint java \
          ${{ inputs.image-tag }} \
          -version

    - name: Test GDAL
      shell: bash
      run: |
        docker run --rm \
          --platform ${{ inputs.platform }} \
          --entrypoint gdalinfo \
          ${{ inputs.image-tag }} \
          --version
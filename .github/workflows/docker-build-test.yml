name: Test Docker Hub OIDC Connection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC token exchange
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          password: ${{ steps.docker_oidc.outputs.token }}
